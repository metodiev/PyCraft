name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e "backend[dev]"

      - name: Lint
        run: ruff check backend/app backend/tests runner

      - name: Tests
        run: pytest backend/tests -q

  runner:
    name: Runner image + sandbox tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build runner image
        run: docker build -t pycraft-runner:3.12 -f runner/Dockerfile runner/

      - name: Install backend dependencies
        run: pip install -e "backend[dev]"

      - name: Sandbox integration tests
        # Asserts the security properties documented in docs/security-model.md.
        run: pytest backend/tests/test_docker_execution.py -q -m docker

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

  challenges:
    name: Challenge content validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Validate challenge format
        # Fails if any challenge is malformed, so content review happens in CI.
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path

          from app.services.challenges import ChallengeRepository

          repository = ChallengeRepository(Path("../challenges"))
          loaded = repository.load_all(strict=True)
          print(f"Validated {len(loaded)} challenges")
          for challenge in loaded:
              print(
                  f"  {challenge.id}: {challenge.visible_test_count} visible, "
                  f"{challenge.hidden_test_count} hidden"
              )
          PY
