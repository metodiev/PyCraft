<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PyCraft — an interactive Python engineering training platform that takes you from junior to principal engineer."
    />
    <meta name="color-scheme" content="dark light" />
    <title>PyCraft — Python Engineering Lab</title>
    <script>
      // Resolve the theme before the first paint. Inline and synchronous on
      // purpose: a bundled module is fetched after the stylesheet is applied,
      // which would flash the wrong theme for a frame. This mirrors
      // `src/lib/theme.ts` and cannot import it.
      (function () {
        try {
          var choice = localStorage.getItem("pycraft.theme");
          var theme =
            choice === "light" || choice === "dark"
              ? choice
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          // Blocked storage or matchMedia. `tokens.css` defaults to dark, so
          // leaving the attribute off still renders a supported theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
